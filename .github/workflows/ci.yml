# Lints the repository, runs the unit suite on Node.js and Deno, lints the
# devkit and runs its unit suite on Node.js and Deno, builds a project from
# the skeleton to run its own tests and lint, and runs the integration suite
# against a test app started on the runner, on Node.js and on Deno, for every
# push to any branch and every pull request.
#
# The integration suite's deployed targets are not run here: the operator
# runs those.
#
# Each job checks one thing, so a failed job names its cause. Add a new check
# as a new job.
#
# package-lock.json is not tracked: there are no runtime dependencies, and the
# dev dependencies are pinned exactly in package.json. So jobs install with
# `npm install`; `npm ci` would fail without a lockfile. The Deno job installs
# too, because Deno resolves kixx-test from the same node_modules/.

name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Keep a result for every commit on main. Elsewhere only the newest push
  # matters.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dev dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: node run-linter.js

  test-node:
    name: Test on Node.js
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dev dependencies
        run: npm install --no-audit --no-fund

      - name: Test on Node.js
        run: node run-tests.js

  test-deno:
    name: Test on Deno
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.8.x

      # Only to run npm install; the tests run on Deno.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dev dependencies
        run: npm install --no-audit --no-fund

      - name: Test on Deno
        run: deno run -A run-tests.js

  # The devkit (the kixx-dev CLI) has its own lint config and test runner,
  # and the root lint and test jobs skip devkit/. It has no node_modules/ of
  # its own: its runners resolve kixx-test and kixx-linting from the root's,
  # so these jobs install only the root's dev dependencies.
  devkit-lint:
    name: Lint the devkit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dev dependencies
        run: npm install --no-audit --no-fund

      - name: Lint the devkit
        run: node devkit/run-linter.js devkit

  devkit-test-node:
    name: Test the devkit on Node.js
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dev dependencies
        run: npm install --no-audit --no-fund

      - name: Test the devkit on Node.js
        run: node devkit/run-tests.js

  devkit-test-deno:
    name: Test the devkit on Deno
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.8.x

      # Only to run npm install; the tests run on Deno.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dev dependencies
        run: npm install --no-audit --no-fund

      - name: Test the devkit on Deno
        run: deno run -A devkit/run-tests.js

  # A project with no plugins, built from the skeleton and core, passes its
  # own tests and lint with no further setup (SCAF-7). Its package.json,
  # runners, and lint config are used here and nowhere else.
  skeleton:
    name: Skeleton project
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.8.x

      - name: Install dev dependencies
        run: npm install --no-audit --no-fund

      - name: Build a project with no plugins
        run: node tools/build-project.js "$RUNNER_TEMP/core-only"

      - name: Install the project's dev dependencies
        working-directory: ${{ runner.temp }}/core-only
        run: npm install --no-audit --no-fund

      - name: Run the project's tests on Node.js
        working-directory: ${{ runner.temp }}/core-only
        run: node run-tests.js

      - name: Lint the project
        working-directory: ${{ runner.temp }}/core-only
        run: node run-linter.js

      - name: Run the project's tests on Deno
        working-directory: ${{ runner.temp }}/core-only
        run: deno run -A run-tests.js

      # The project's drift test must notice an edited generated file.
      - name: Fail the project's tests on an edited generated file
        working-directory: ${{ runner.temp }}/core-only
        run: |
          echo '// edited' >> routes.generated.js
          if node run-tests.js; then
            echo 'The drift test passed on an edited generated file.'
            exit 1
          fi

  # The integration suite against a test app on this machine, with production
  # settings (QA-8). run-local.js builds the test app, starts it, runs the
  # suite, and stops it. It makes a deploy key for the run, so the job needs
  # no secret. A Node.js run tests a Node.js server and a Deno run a Deno
  # server. On a failure it prints the end of the server's log.
  integration-local:
    name: Integration tests on local ${{ matrix.runtime }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: Node.js
            command: node test-app/run-local.js
          - runtime: Deno
            command: deno run -A test-app/run-local.js

    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.8.x

      - name: Install dev dependencies
        run: npm install --no-audit --no-fund

      - name: Run the integration suite on ${{ matrix.runtime }}
        run: ${{ matrix.command }}
