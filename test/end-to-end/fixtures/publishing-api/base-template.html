{{!--
    End-to-end test fixture: a minimal Kixx base template.

    Deliberately self contained. It references no partials, so it stays valid
    on its own if a future test publishes it and then renders it.
--}}
<!doctype html>
<html lang="en-US">
    <head>
        <meta charset="utf-8">
        <title>{{ title }}</title>
    </head>
    <body>
        {{#if body }}
            {{{ body }}}
        {{ else }}
            <p>No content.</p>
        {{/if}}
    </body>
</html>
